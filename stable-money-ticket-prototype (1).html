<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Money — Smart Ticket System Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#06080D;color:#F0F2F5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A3352;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  bg:"#0A0E17", surface:"#131924", card:"#1A2133", border:"#2A3352",
  teal:"#00D4AA", tealDark:"#00A888", tealBg:"rgba(0,212,170,0.08)",
  amber:"#FFB020", amberBg:"rgba(255,176,32,0.08)",
  red:"#FF4D4D", redBg:"rgba(255,77,77,0.08)",
  green:"#34D399", greenBg:"rgba(52,211,153,0.08)",
  white:"#F0F2F5", tp:"#E8ECF2", ts:"#8892A5", tm:"#5A6478",
};

function App() {
  const [screen, setScreen] = useState("my_fds");
  const [selectedFD, setSelectedFD] = useState(null);
  const [selectedIssue, setSelectedIssue] = useState(null);
  const [userNote, setUserNote] = useState("");
  const [ticketId] = useState("SM-" + Math.floor(100000 + Math.random() * 900000));
  const [showToast, setShowToast] = useState(false);

  const fds = [
    { id:1, bank:"Suryoday SF Bank", code:"SUR", amount:"2,50,000", tenure:"12 months", rate:"8.25%", status:"Active", maturity:"28 Jun 2027", color:"#2563EB", txnId:"RPY_8847291", bookDate:"28 Jun 2026, 3:42 PM", payStatus:"Confirmed (Razorpay)", daysSince:6 },
    { id:2, bank:"Unity SF Bank", code:"UNI", amount:"1,00,000", tenure:"6 months", rate:"7.75%", status:"Active", maturity:"15 Jan 2027", color:"#16A34A", txnId:"RPY_7723456", bookDate:"15 Jul 2026, 11:20 AM", payStatus:"Confirmed (Razorpay)", daysSince:0 },
    { id:3, bank:"Shivalik SF Bank", code:"SHV", amount:"50,000", tenure:"12 months", rate:"8.10%", status:"Certificate pending", maturity:"02 Mar 2027", color:"#D97706", txnId:"RPY_9923847", bookDate:"02 Mar 2026, 11:23 AM", payStatus:"Confirmed (Razorpay)", daysSince:125 },
  ];

  const issues = [
    { id:1, icon:"📄", title:"FD certificate not received", desc:"Booked my FD but haven't received the certificate yet", tag:"Most common" },
    { id:2, icon:"⏳", title:"Withdrawal taking longer than expected", desc:"Requested withdrawal but money hasn't reached my account" },
    { id:3, icon:"💰", title:"Interest not credited as expected", desc:"Expected interest payout hasn't arrived or amount seems wrong" },
    { id:4, icon:"🔄", title:"FD details seem incorrect", desc:"Tenure, rate, or amount showing differently than what I booked" },
    { id:5, icon:"📱", title:"Can't find my FD in the app", desc:"Booked an FD but it's not showing in my Passbook" },
    { id:6, icon:"❓", title:"Something else about this FD", desc:"Other issue not listed above" },
  ];

  const pastTickets = [
    { id:"SM-281034", bank:"Suryoday SF Bank", amount:"₹2,50,000", issue:"Interest amount query", status:"Resolved", statusColor:C.green, days:"Resolved in 36 hrs" },
    { id:"SM-276455", bank:"Unity SF Bank", amount:"₹1,00,000", issue:"Withdrawal timing query", status:"Resolved", statusColor:C.green, days:"Resolved in 18 hrs" },
  ];

  const navigate = (s) => setScreen(s);

  const handleRaiseTicket = () => {
    setShowToast(true);
    setTimeout(() => setShowToast(false), 3000);
    navigate("ticket_created");
  };

  const getDaysSinceLabel = (fd) => {
    if (!fd) return "";
    if (fd.daysSince === 0) return "Today";
    if (fd.daysSince === 1) return "1 day";
    return fd.daysSince + " days";
  };

  return (
    <div style={{padding:"20px 16px",maxWidth:440,margin:"0 auto",position:"relative"}}>
      {showToast && (
        <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",background:C.teal,color:C.bg,padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:600,zIndex:100,boxShadow:"0 8px 32px rgba(0,212,170,0.3)"}}>
          Ticket raised successfully
        </div>
      )}

      <div style={{background:C.bg,borderRadius:40,border:`2px solid ${C.border}`,padding:"48px 0 0",overflow:"hidden",boxShadow:"0 24px 80px rgba(0,0,0,0.6)",position:"relative"}}>
        <div style={{position:"absolute",top:12,left:"50%",transform:"translateX(-50%)",width:120,height:28,borderRadius:14,background:"#000"}} />
        <div style={{padding:"0 24px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:C.ts,fontSize:12,fontWeight:600}}>9:41</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill={C.tm}/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1" fill={C.tm}/><rect x="9" y="0" width="3" height="12" rx="1" fill={C.ts}/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill={C.ts}/></svg>
          </div>
        </div>

        <div style={{padding:"0 20px 20px",minHeight:600}}>
          {screen === "my_fds" && <ScreenMyFDs fds={fds} onSelect={(fd) => {setSelectedFD(fd);navigate("select_issue");}} onTickets={() => navigate("all_tickets")} onFaq={() => navigate("faq")} />}
          {screen === "select_issue" && <ScreenSelectIssue fd={selectedFD} issues={issues} selected={selectedIssue} onSelect={setSelectedIssue} onContinue={() => navigate("issue_detail")} onBack={() => navigate("my_fds")} />}
          {screen === "issue_detail" && <ScreenIssueDetail fd={selectedFD} issue={issues.find(i=>i.id===selectedIssue)} selectedIssueId={selectedIssue} note={userNote} onNoteChange={setUserNote} onRaise={handleRaiseTicket} onBack={() => navigate("select_issue")} getDaysSinceLabel={getDaysSinceLabel} />}
          {screen === "ticket_created" && <ScreenTicketCreated ticketId={ticketId} fd={selectedFD} issue={issues.find(i=>i.id===selectedIssue)} onTrack={() => navigate("ticket_status")} />}
          {screen === "ticket_status" && <ScreenTicketStatus ticketId={ticketId} fd={selectedFD} issue={issues.find(i=>i.id===selectedIssue)} onBack={() => navigate("all_tickets")} />}
          {screen === "all_tickets" && <ScreenAllTickets ticketId={ticketId} fd={selectedFD} issue={issues.find(i=>i.id===selectedIssue)} pastTickets={pastTickets} onSelect={() => navigate("ticket_status")} onBack={() => navigate("my_fds")} onNew={() => navigate("my_fds")} />}
          {screen === "faq" && <ScreenFAQ onBack={() => navigate("my_fds")} onRaise={() => navigate("my_fds")} />}
        </div>

        <div style={{display:"flex",justifyContent:"space-around",padding:"10px 16px 20px",borderTop:`1px solid ${C.border}`,background:C.bg}}>
          {[
            {label:"Home",icon:"⌂",s:"my_fds"},
            {label:"Invest",icon:"↗"},
            {label:"Portfolio",icon:"◧"},
            {label:"Support",icon:"◉",active:true,s:"my_fds"},
            {label:"More",icon:"≡"},
          ].map((item,i) => (
            <div key={i} onClick={() => item.s && navigate(item.s)} style={{textAlign:"center",cursor:"pointer"}}>
              <div style={{fontSize:18,color:item.active?C.teal:C.tm}}>{item.icon}</div>
              <div style={{fontSize:10,marginTop:2,color:item.active?C.teal:C.tm,fontWeight:item.active?600:400}}>{item.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{textAlign:"center",padding:"24px 0 12px",color:C.tm,fontSize:11}}>
        Stable Money — Smart Ticket System Prototype<br/>
        Built for Airtribe PM Launchpad Case Study
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// SCREEN: MY FDs
// ═══════════════════════════════════════
function ScreenMyFDs({ fds, onSelect, onTickets, onFaq }) {
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20}}>
        <span style={{color:C.white,fontSize:17,fontWeight:700}}>My fixed deposits</span>
      </div>
      <div style={{color:C.tm,fontSize:11,marginBottom:10,fontWeight:500,letterSpacing:"0.04em"}}>ACTIVE FDs</div>
      {fds.map((fd,i) => (
        <div key={fd.id} style={{background:C.card,borderRadius:12,padding:14,marginBottom:10,border:`1px solid ${fd.status==="Certificate pending"?C.amber:C.border}`,transition:"border-color 0.2s"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <div style={{width:36,height:36,borderRadius:8,background:`${fd.color}18`,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{color:fd.color,fontSize:11,fontWeight:700}}>{fd.code}</span>
            </div>
            <div style={{flex:1}}>
              <div style={{color:C.white,fontSize:14,fontWeight:600}}>{fd.bank}</div>
              <div style={{color:C.ts,fontSize:12}}>₹{fd.amount} · {fd.tenure} · {fd.rate}</div>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{display:"inline-flex",alignItems:"center",gap:4,background:fd.status==="Certificate pending"?C.amberBg:C.greenBg,padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:500,color:fd.status==="Certificate pending"?C.amber:C.green}}>
              <div style={{width:5,height:5,borderRadius:3,background:fd.status==="Certificate pending"?C.amber:C.green}} />
              {fd.status}
            </span>
            <button onClick={() => onSelect(fd)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.teal,fontSize:12,fontWeight:500,transition:"all 0.2s"}}
              onMouseEnter={e=>{e.target.style.background=C.tealBg;e.target.style.borderColor=C.teal}}
              onMouseLeave={e=>{e.target.style.background="transparent";e.target.style.borderColor=C.border}}>
              Need help?
            </button>
          </div>
          {fd.status==="Certificate pending" && (
            <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:C.amberBg,border:`1px solid rgba(255,176,32,0.15)`,fontSize:12,color:C.amber,lineHeight:1.5}}>
              Your FD certificate from {fd.bank} is still being processed. This usually takes 2-3 business days.
            </div>
          )}
        </div>
      ))}
      <div style={{color:C.tm,fontSize:11,marginTop:16,marginBottom:10,fontWeight:500,letterSpacing:"0.04em"}}>QUICK ACTIONS</div>
      <div style={{display:"flex",gap:8}}>
        {[
          {icon:"🎫",label:"My tickets",sub:"View all",action:onTickets},
          {icon:"❓",label:"FAQs",sub:"Common answers",action:onFaq},
          {icon:"📞",label:"Call us",sub:"Mon-Fri 10-7"},
        ].map((item,i) => (
          <div key={i} onClick={item.action} style={{flex:1,background:C.card,borderRadius:10,padding:12,textAlign:"center",border:`1px solid ${C.border}`,cursor:"pointer",transition:"background 0.2s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#1F2841"}
            onMouseLeave={e=>e.currentTarget.style.background=C.card}>
            <div style={{fontSize:20,marginBottom:4}}>{item.icon}</div>
            <div style={{color:C.white,fontSize:12,fontWeight:500}}>{item.label}</div>
            <div style={{color:C.tm,fontSize:11}}>{item.sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// SCREEN: SELECT ISSUE
// ═══════════════════════════════════════
function ScreenSelectIssue({ fd, issues, selected, onSelect, onContinue, onBack }) {
  const [localSelected, setLocalSelected] = useState(selected || 1);
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
        <span onClick={onBack} style={{color:C.tm,fontSize:20,cursor:"pointer"}}>←</span>
        <span style={{color:C.white,fontSize:17,fontWeight:700}}>What's the issue?</span>
      </div>
      {fd && (
        <div style={{background:C.card,borderRadius:10,padding:10,marginBottom:16,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:6,background:`${fd.color}18`,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{color:fd.color,fontSize:10,fontWeight:700}}>{fd.code}</span>
          </div>
          <div>
            <div style={{color:C.white,fontSize:13,fontWeight:600}}>{fd.bank}</div>
            <div style={{color:C.ts,fontSize:11}}>₹{fd.amount} · {fd.tenure} · {fd.rate}</div>
          </div>
        </div>
      )}
      <div style={{color:C.tm,fontSize:11,marginBottom:10,fontWeight:500,letterSpacing:"0.04em"}}>SELECT YOUR ISSUE</div>
      {issues.map((issue) => (
        <div key={issue.id} onClick={() => {setLocalSelected(issue.id);onSelect(issue.id);}} style={{
          background:localSelected===issue.id?C.tealBg:C.card,borderRadius:12,padding:"10px 12px",marginBottom:6,
          border:`1px solid ${localSelected===issue.id?C.teal:C.border}`,cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"all 0.2s",
        }}>
          <span style={{fontSize:18,flexShrink:0}}>{issue.icon}</span>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{color:C.white,fontSize:13,fontWeight:600}}>{issue.title}</span>
              {issue.tag && <span style={{fontSize:9,padding:"1px 6px",borderRadius:8,background:C.amberBg,color:C.amber,fontWeight:500}}>{issue.tag}</span>}
            </div>
            <div style={{color:C.ts,fontSize:11,marginTop:2}}>{issue.desc}</div>
          </div>
          <div style={{width:18,height:18,borderRadius:9,border:`2px solid ${localSelected===issue.id?C.teal:C.tm}`,background:localSelected===issue.id?C.teal:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
            {localSelected===issue.id && <span style={{color:C.bg,fontSize:11}}>✓</span>}
          </div>
        </div>
      ))}
      <button onClick={onContinue} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.teal},${C.tealDark})`,color:C.bg,fontSize:15,fontWeight:700,marginTop:10,transition:"opacity 0.2s"}}
        onMouseEnter={e=>e.target.style.opacity="0.9"}
        onMouseLeave={e=>e.target.style.opacity="1"}>
        Continue
      </button>
    </div>
  );
}

// ═══════════════════════════════════════
// SCREEN: ISSUE DETAIL
// ═══════════════════════════════════════
function ScreenIssueDetail({ fd, issue, selectedIssueId, note, onNoteChange, onRaise, onBack, getDaysSinceLabel }) {
  const baseRows = [
    {label:"Booking date",value:fd?.bookDate || "02 Mar 2026, 11:23 AM"},
    {label:"Transaction ID",value:fd?.txnId || "RPY_9923847"},
    {label:"Payment status",value:fd?.payStatus || "Confirmed (Razorpay)",vc:C.green},
    {label:"Amount",value:`₹${fd?.amount || "50,000"}`},
  ];

  const issueSpecificRows = {
    1: [{label:"FD status",value:fd?.status || "Certificate pending",vc:C.amber}],
    2: [{label:"Withdrawal requested",value:"Pending"}],
    3: [{label:"Expected payout",value:"As per booked rate"},{label:"Maturity date",value:fd?.maturity || "02 Mar 2027"}],
    4: [{label:"Booked tenure",value:fd?.tenure || "12 months"},{label:"Booked rate",value:fd?.rate || "8.10%"}],
    5: [],
    6: [],
  };

  const rows = [...baseRows, ...(issueSpecificRows[selectedIssueId] || [])];

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
        <span onClick={onBack} style={{color:C.tm,fontSize:20,cursor:"pointer"}}>←</span>
        <span style={{color:C.white,fontSize:17,fontWeight:700}}>Tell us more</span>
      </div>
      <div style={{background:C.card,borderRadius:10,padding:12,marginBottom:16,border:`1px solid ${C.border}`}}>
        <div style={{color:C.tm,fontSize:11,fontWeight:500,marginBottom:6,letterSpacing:"0.04em"}}>ISSUE</div>
        <div style={{color:C.white,fontSize:14,fontWeight:600}}>{issue?.title || "FD certificate not received"}</div>
        <div style={{color:C.ts,fontSize:12,marginTop:2}}>{fd?.bank} · ₹{fd?.amount} · {fd?.tenure}</div>
      </div>
      <div style={{color:C.tm,fontSize:11,fontWeight:500,marginBottom:6,letterSpacing:"0.04em"}}>AUTO-FILLED FROM YOUR RECORDS</div>
      <div style={{background:C.card,borderRadius:10,padding:12,marginBottom:16,border:`1px solid ${C.border}`}}>
        {rows.map((row,i) => (
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<rows.length-1?`1px solid ${C.border}`:"none"}}>
            <span style={{color:C.tm,fontSize:12}}>{row.label}</span>
            <span style={{color:row.vc||C.white,fontSize:12,fontWeight:500}}>{row.value}</span>
          </div>
        ))}
      </div>
      <div style={{color:C.tm,fontSize:11,fontWeight:500,marginBottom:6,letterSpacing:"0.04em"}}>YOUR INPUT (OPTIONAL)</div>
      <textarea value={note} onChange={e=>onNoteChange(e.target.value)} placeholder="Any additional details you'd like to share..."
        style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:12,color:C.white,fontSize:13,minHeight:70,resize:"vertical",fontFamily:"inherit",outline:"none"}} />
      <div style={{background:C.card,borderRadius:10,padding:12,marginTop:12,marginBottom:12,border:`1px dashed ${C.border}`,textAlign:"center",cursor:"pointer",transition:"background 0.2s"}}
        onMouseEnter={e=>e.currentTarget.style.background="#1F2841"}
        onMouseLeave={e=>e.currentTarget.style.background=C.card}>
        <span style={{color:C.tm,fontSize:13}}>📎 Attach screenshot (optional)</span>
      </div>
      <div style={{background:C.tealBg,borderRadius:10,padding:12,marginBottom:12,border:`1px solid rgba(0,212,170,0.15)`,fontSize:12,color:C.ts,lineHeight:1.6}}>
        <span style={{color:C.teal,fontWeight:600}}>What happens next: </span>
        We'll check our records and reach out to {fd?.bank || "the bank"} on your behalf. You'll receive an update within 48 hours with findings and next steps.
      </div>
      <button onClick={onRaise} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.teal},${C.tealDark})`,color:C.bg,fontSize:15,fontWeight:700,transition:"opacity 0.2s"}}
        onMouseEnter={e=>e.target.style.opacity="0.9"}
        onMouseLeave={e=>e.target.style.opacity="1"}>
        Raise ticket
      </button>
    </div>
  );
}

// ═══════════════════════════════════════
// SCREEN: TICKET CREATED
// ═══════════════════════════════════════
function ScreenTicketCreated({ ticketId, fd, issue, onTrack }) {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const t1 = setTimeout(() => setProgress(1), 800);
    const t2 = setTimeout(() => setProgress(2), 1600);
    return () => {clearTimeout(t1);clearTimeout(t2);};
  }, []);

  const steps = [
    {text:"Check our booking records for your FD"},
    {text:`Verify payment confirmation with Razorpay`},
    {text:`Reach out to ${fd?.bank || "the bank"} for status`},
    {text:"Update you with findings within 48 hours"},
  ];

  return (
    <div>
      <div style={{textAlign:"center",padding:"20px 0 24px"}}>
        <div style={{width:60,height:60,borderRadius:30,background:C.tealBg,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",border:`2px solid ${C.teal}`}}>
          <span style={{color:C.teal,fontSize:30}}>✓</span>
        </div>
        <div style={{color:C.white,fontSize:18,fontWeight:700}}>Ticket raised</div>
        <div style={{color:C.ts,fontSize:13,marginTop:4}}>We're looking into this for you</div>
      </div>
      <div style={{background:C.card,borderRadius:12,padding:16,marginBottom:16,border:`1px solid ${C.teal}`}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{color:C.tm,fontSize:11}}>TICKET ID</div>
            <div style={{color:C.teal,fontSize:18,fontWeight:700}}>{ticketId}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:C.tm,fontSize:11}}>STATUS</div>
            <span style={{display:"inline-flex",alignItems:"center",gap:4,background:C.amberBg,padding:"3px 10px",borderRadius:12,color:C.amber,fontSize:12,fontWeight:500}}>
              <div style={{width:6,height:6,borderRadius:3,background:C.amber}} />
              Investigating
            </span>
          </div>
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12}}>
          {[
            {l:"Issue",v:issue?.title || "FD certificate not received"},
            {l:"FD",v:`${fd?.bank || "Shivalik SF Bank"} · ₹${fd?.amount || "50,000"}`},
            {l:"Raised on",v:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + ", " + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})},
            {l:"Expected update by",v:"Within 48 hours"},
          ].map((r,i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0"}}>
              <span style={{color:C.tm,fontSize:12}}>{r.l}</span>
              <span style={{color:C.white,fontSize:12,fontWeight:500,textAlign:"right",maxWidth:"60%"}}>{r.v}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{color:C.tm,fontSize:11,fontWeight:500,marginBottom:8,letterSpacing:"0.04em"}}>WHAT WE'LL DO</div>
      {steps.map((step,i) => (
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<3?`1px solid ${C.border}`:"none",transition:"opacity 0.3s",opacity:i<=progress+1?1:0.4}}>
          <span style={{color:i<=progress?C.teal:C.tm,fontSize:14,fontWeight:700,width:18,textAlign:"center",transition:"color 0.3s"}}>{i<=progress?"✓":"◌"}</span>
          <span style={{color:i<=progress?C.tp:C.ts,fontSize:13,transition:"color 0.3s"}}>{step.text}</span>
        </div>
      ))}
